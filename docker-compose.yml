services:
  postgres:
    image: postgres:16-alpine
    container_name: prospectpilot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prospectpilot
    ports:
      - "5432:5432"
    volumes:
      - prospectpilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prospectpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prospectpilot-redis
    ports:
      - "6379:6379"
    volumes:
      - prospectpilot-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prospectpilot-postgres:
  prospectpilot-redis:

